[package]
name = "kunobi-ha"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Building blocks for high-availability Kubernetes controllers — Lease-based leader election to start."
repository = "https://github.com/kunobi-ninja/kunobi-ha"
keywords = ["kubernetes", "leader-election", "lease", "controller", "operator"]
categories = ["asynchronous", "web-programming"]

[features]
# Proxy features to k8s-openapi so a downstream binary can pick its
# Kubernetes API version through this crate's surface (e.g.
# `kunobi-ha = { version = "0.1", features = ["v1_31"] }`) instead of
# also adding k8s-openapi as a direct dependency. Library consumers
# MUST NOT enable any of these — leave the choice to the final binary.
v1_31 = ["k8s-openapi/v1_31"]
v1_32 = ["k8s-openapi/v1_32"]
v1_33 = ["k8s-openapi/v1_33"]
v1_34 = ["k8s-openapi/v1_34"]
v1_35 = ["k8s-openapi/v1_35"]
latest = ["k8s-openapi/latest"]

[dependencies]
# Kubernetes — library crates MUST NOT enable a specific version feature on
# k8s-openapi by default; it is up to the binary consumer (or one of the
# proxy features above) to pick `v1_xx`, so there is only one version
# across the dependency tree. `dev-dependencies` below enable `latest` so
# our own tests can run standalone.
kube = { version = "3", features = ["client"], default-features = false }
k8s-openapi = "0.27"

# Async
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Identity fallback
uuid = { version = "1", features = ["v4"] }

# Errors
thiserror = "2"

# Logging
tracing = "0.1"

[dev-dependencies]
# Wiremock for simulating the Kubernetes API in unit tests — no real cluster needed.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
anyhow = "1"
serde_json = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Pick a k8s-openapi version so our own tests can build. Binary consumers
# of kunobi-ha must activate their own `v1_xx` feature instead.
k8s-openapi = { version = "0.27", features = ["latest"] }

[package.metadata.docs.rs]
# docs.rs builds the lib without dev-dependencies, so a k8s-openapi
# version feature must be active or the build script panics.
features = ["latest"]
rustdoc-args = ["--cfg", "docsrs"]
