[package]
name = "kunobi-ha"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Building blocks for high-availability Kubernetes controllers — Lease-based leader election to start."
repository = "https://github.com/kunobi-ninja/kunobi-ha"
keywords = ["kubernetes", "leader-election", "lease", "controller", "operator"]
categories = ["asynchronous", "web-programming"]

[dependencies]
# Kubernetes
kube = { version = "3", features = ["client"], default-features = false }
k8s-openapi = { version = "0.27", features = ["latest"] }

# Async
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Identity fallback
uuid = { version = "1", features = ["v4"] }

# Errors
thiserror = "2"

# Logging
tracing = "0.1"

[dev-dependencies]
# Wiremock for simulating the Kubernetes API in unit tests — no real cluster needed.
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
anyhow = "1"
serde_json = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
