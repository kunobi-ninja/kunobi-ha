name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  # Silence the Node 20 deprecation warning emitted by actions/checkout
  # and actions/cache. Node 24 becomes the default in June 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  checks:
    name: Rust Checks
    runs-on: kunobi-runners
    container:
      image: rust:1.94.1-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # `~/.cargo/bin` caches installed tools so cargo-deny doesn't
          # recompile every run. Splitting registry into index/cache
          # (skipping `src`) keeps the cache smaller.
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      # Verify the library compiles standalone with each end of the
      # supported k8s-openapi version range. This is the only place that
      # builds the lib without dev-dependencies, so it's the only place
      # that catches an accidental version pin in `[dependencies]`.
      # We deliberately do NOT use `--all-features` here: the version
      # proxy features (`v1_31` … `latest`) are mutually exclusive on
      # k8s-openapi, and enabling them all at once is a build error.
      - name: Build lib (minimum supported version)
        run: cargo build --lib --features v1_31

      - name: Build lib (latest)
        run: cargo build --lib --features latest

      - name: Build examples
        run: cargo build --examples

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build docs
        run: cargo doc --lib --no-deps --features latest

  # Verify the rust-version pinned in Cargo.toml actually compiles the
  # crate. Without this job, the MSRV claim has no teeth.
  msrv:
    name: MSRV (1.94.1)
    runs-on: kunobi-runners
    container:
      image: rust:1.94.1-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-msrv-${{ runner.os }}-
      - name: Build
        run: cargo build --lib --features latest

  # cargo-deny replaces cargo-audit + cargo-outdated. It checks RustSec
  # advisories, license policy, banned crates, and duplicate versions in
  # one pass — generally faster and better maintained than running the
  # two tools separately.
  deny:
    name: cargo-deny
    runs-on: kunobi-runners
    container:
      image: rust:1.94.1-bookworm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: cargo-deny-${{ runner.os }}-
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null; then
            cargo install cargo-deny --locked
          fi
      - name: cargo deny check
        run: cargo deny check
